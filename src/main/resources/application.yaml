spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Spring

  datasource:
    url: jdbc:postgresql://localhost:5433/spring_db
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60